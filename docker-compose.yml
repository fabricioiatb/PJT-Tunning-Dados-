services:
  postgres:
    image: postgres:16-alpine
    container_name: garagem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagem
      POSTGRES_PASSWORD: garagem
      POSTGRES_DB: garagem_clientes
    ports:
      - "5433:5432"   # 5433 no host p/ não conflitar com um Postgres instalado localmente
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: garagem-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: cassandra:4.1
    container_name: garagem-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: garagem-cluster
      # Heap reduzido para rodar em notebook (o padrão usa 1/4 da RAM).
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    # O Cassandra leva ~1 min para aceitar conexões; "docker compose ps"
    # mostra "healthy" quando o CQL já responde.
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  postgres_data:
  mongo_data:
  cassandra_data:
