services:
  postgres:
    image: postgres:16-alpine
    container_name: garagem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagem
      POSTGRES_PASSWORD: garagem
      POSTGRES_DB: garagem_clientes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: garagem-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: cassandra:4.1
    container_name: garagem-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: garagem-cluster
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

volumes:
  postgres_data:
  mongo_data:
  cassandra_data:
